[package]
name = "rongy-spine"
version = "0.1.0"
edition = "2021"
authors = ["Máté Róbert <mate@example.com>"]
description = "Safe Self-Evolving Rust System with AST-level mutation"
license = "MIT"
repository = "https://github.com/silentnoisehun/rongy-spine"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"
rand = "0.8"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true